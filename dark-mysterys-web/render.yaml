# ==========================================================================
# Render Blueprint — Dark Mystery's
# ==========================================================================
# Despliega la plataforma COMPLETA (backend FastAPI + frontend SPA) en un
# único Web Service, más una base de datos PostgreSQL administrada.
#
# Cómo usarlo:
#   1. Subí este repositorio a GitHub.
#   2. En Render: New + → Blueprint → elegí el repositorio.
#   3. Render detecta este archivo y crea todo automáticamente.
#
# Nota: la base "free" de Render se elimina a los 90 días. Para una base
# permanente y gratuita, usá Neon o Supabase y definí DATABASE_URL a mano
# (ver docs/DEPLOY.md → Opción B).
# ==========================================================================

databases:
  - name: dark-mysterys-db
    databaseName: darkmysterys
    user: darkmysterys
    plan: free
    region: oregon

services:
  - type: web
    name: dark-mysterys
    runtime: python
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: "pwd && ls -la && ls -la backend && pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      # Render genera una clave secreta aleatoria y segura.
      - key: SECRET_KEY
        generateValue: true
      # Render inyecta la cadena de conexión de la base creada arriba.
      - key: DATABASE_URL
        fromDatabase:
          name: dark-mysterys-db
          property: connectionString
      - key: DEFAULT_TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: SHOP_ENFORCE_HOURS
        value: "true"
      # En producción real, cambiar a "smtp" y cargar credenciales.
      - key: EMAIL_BACKEND
        value: console
      - key: CORS_ORIGINS
        value: "*"
